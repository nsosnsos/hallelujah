{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center" id="div_input">
        <div class="col-md-6">
            <form method="get" role="form" class="search-group my-3" action="{{ url_for('main.proxy') }}">
                <span class="search-icon"><i class="bi-ladder mx-1"></i></span>
                <input class="form-control search-input" type="url" id="proxy" name="url" placeholder="https://example.com" onkeydown="handleKeyDown(event)" autofocus required>
            </form>
        </div>
    </div>
    <div class="row" id="div_output">
        <iframe class="proxy-border mb-3" id="iframe_output" name="iframe_output" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>
    </div>
{% endblock content %}

{% block scripts %}
    {{ super() }}
    <script type="text/javascript">
        function loadUrl() {
            let url = document.getElementById("proxy").value;
            if (!/^https?:\/\//i.test(url)) {
                url = "https://" + url;
            }
            document.getElementById("iframe_output").src = `/proxy?url=${encodeURIComponent(url)}`;
        }

        function handleKeyDown(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                loadUrl();
            }
        }

        function iframe_adaption() {
            const header = document.querySelector("header");
            const footer = document.querySelector("footer");
            const dataContainer = document.querySelector("#data_container");
            const divInput = document.querySelector("#div_input");
            const divOutput = document.querySelector("#div_output");
            const iframeOutput = document.querySelector("#iframe_output");
            if (!header || !footer || !dataContainer || !divInput || !divOutput || !iframeOutput) return;
            const outerHeight = element => {
                const style = getComputedStyle(element);
                return element.clientHeight + parseFloat(style.marginTop || 0) + parseFloat(style.marginBottom || 0);
            };
            const dataHeight = Math.max(240, window.innerHeight - outerHeight(header) - outerHeight(footer));
            dataContainer.style.height = dataHeight + "px";
            divOutput.style.height = Math.max(160, dataHeight - outerHeight(divInput)) + "px";
            iframeOutput.style.height = Math.max(120, divOutput.clientHeight - outerHeight(iframeOutput) + iframeOutput.clientHeight) + "px";
        }
        window.addEventListener("load", iframe_adaption);
        window.addEventListener("resize", iframe_adaption);
    </script>
{% endblock scripts %}
